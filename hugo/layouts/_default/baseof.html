<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  {{ if eq hugo.Environment "staging" }}
  <meta name="robots" content="noindex, nofollow">
  {{ end }}
  {{ partial "head-meta.html" . }}
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="{{ "css/design-tokens.css" | relURL }}">
</head>
<body>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/CookieConsent.js" | relURL }}"></script>

    <div class="mobile-menu" id="mobile-menu" role="dialog" aria-modal="true" aria-label="Меню" hidden>
    <div class="mobile-menu__backdrop" data-menu-close></div>
    <nav class="mobile-menu__panel">
      <button class="mobile-menu__close" data-menu-close aria-label="Закрыть меню">&times;</button>
      <ul>
        <li><a href="{{ "" | relURL }}">Главная</a></li>
        <li><a href="{{ "posts/" | relURL }}">Статьи</a></li>
        <li><a href="{{ "about/" | relURL }}">О нас</a></li>
        <li><a href="{{ "tags/" | relURL }}">Ярлыки</a></li>
      </ul>
    </nav>
  </div>
  <nav class="sticky-bottom-bar" aria-label="Мобильная навигация">
    <button class="sticky-btn" id="sticky-menu-btn" aria-label="Меню" aria-controls="mobile-menu" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <span>Меню</span>
    </button>
    <button class="sticky-btn" id="sticky-share-btn" aria-label="Поделиться">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      <span>Поделиться</span>
    </button>
    <button class="sticky-btn" id="sticky-top-btn" aria-label="Наверх">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
      <span>Наверх</span>
    </button>
  </nav>
  <script src="{{ "js/StickyBottomBar.js" | relURL }}"></script>
</body>
</html>
