{{ define "main" }}
<div class="post-grid">
  {{ range .Site.RegularPages }}
  <article class="post-card">
    
    <!-- Изображение -->
    {{ with .Params.image }}
    <div class="post-card-image-wrapper">
      <img src="{{ . }}" alt="{{ $.Title }}" loading="lazy">
    </div>
    {{ end }}

    <!-- Контент -->
    <div class="post-card-content">
      <h2 class="post-card-title"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      <time datetime="{{ .Date.Format "2006-01-02" }}" class="post-card-date">{{ .Date.Format "02.01.2006" }}</time>
      
      <!-- Описание: Используем очищенное поле description -->
      {{ with .Params.description }}
        <p class="post-card-summary">{{ . | truncate 150 }}</p>
      {{ end }}
      
      {{ with .GetTerms "tags" }}
      <div class="post-card-tags">
        {{ range . }}<a class="tag" href="{{ .Permalink }}">{{ .LinkTitle }}</a>{{ end }}
      </div>
      {{ end }}
    </div>
  </article>
  {{ end }}
</div>
{{ end }}
