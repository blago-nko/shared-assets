{{ define "main" }}
<div class="container">
  <h1 class="page-title">{{ .Title }}</h1>
  
  {{ if .Content }}
    <div class="page-description">{{ .Content }}</div>
  {{ end }}

  <div class="post-grid">
    {{ range .Paginator.Pages.ByDate.Reverse }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </div>

  {{ template "_internal/pagination.html" . }}
</div>
{{ end }}
