{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ if .IsHome }}
<p class="site-description">{{ .Site.Params.description }}</p>
{{ end }}
<ul class="post-list">
  {{ $pages := .Pages }}
  {{ if .IsHome }}
  {{ $pages = .Site.RegularPages }}
  {{ end }}
  {{ range $pages }}
  <li>
    <a href="{{ .Permalink }}">{{ .Title }}</a>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time>
  </li>
  {{ end }}
</ul>
{{ end }}
