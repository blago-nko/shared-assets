<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
<meta property="og:type" content="{{ if eq .Kind "page" }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:locale" content="ru_RU">

{{ $image := .Params.image | default "logo.webp" }}
{{ $parsedImage := urls.Parse $image }}
{{ if not $parsedImage.IsAbs }}
  {{ $image = $image | absURL }}
{{ end }}

<meta property="og:image" content="{{ $image }}">
<meta property="og:image:alt" content="{{ .Title }}">

{{ with .Params.image_width }}
<meta property="og:image:width" content="{{ . }}">
{{ end }}

{{ with .Params.image_height }}
<meta property="og:image:height" content="{{ . }}">
{{ end }}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ .Description | default .Site.Params.description }}">
<meta name="twitter:image" content="{{ $image }}">

<link rel="icon" href="{{ "favicon.png" | relURL }}" type="image/png">
