{{- $title := .Site.Title -}}
{{- $words := split $title " " -}}
{{- $n := len $words -}}
<a class="site-title" href="{{ "" | relURL }}" aria-label="{{ .Site.Title }}">
{{- range $i, $w := $words }}
  {{- if and (gt $n 1) (eq $i (sub $n 1)) }}<span class="site-title-accent">{{ $w }}</span>{{ else }}<span class="site-title-main">{{ $w }}</span>{{ end }}
  {{- if lt $i (sub $n 1) }} {{ end }}
{{- end }}
</a>
