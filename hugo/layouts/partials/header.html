<header>
  <div class="container">
  <nav>
    <div class="brand">
      <a class="site-logo-link" href="{{ "" | relURL }}" aria-label="{{ .Site.Title }} — на главную">
        {{ with .Site.Params.logo }}
        <img class="site-logo" src="{{ . | relURL }}" alt="" loading="eager" decoding="sync">
        {{ else }}
        <svg class="site-logo" viewBox="0 0 48 48" role="img" aria-hidden="true" focusable="false">
          <rect x="2" y="2" width="44" height="44" rx="12" fill="#2c3e50"/>
          <circle cx="18" cy="24" r="8" fill="none" stroke="#ffffff" stroke-width="3"/>
          <path d="M35 17.5a8.5 8.5 0 1 0 0 13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="38" cy="14" r="3" fill="#e67e22"/>
        </svg>
        {{ end }}
      </a>
      <div class="brand-text">
        {{ partial "site-title.html" . }}
        {{ if .IsHome }}<p class="site-tagline">{{ .Site.Params.description }}</p>{{ end }}
      </div>
    </div>
    <ul>
      <li><a href="{{ "posts/" | relURL }}">Статьи</a></li>
      <li><a href="{{ "about/" | relURL }}">О нас</a></li>
      <li class="nav-search-item">
        {{ partial "search-trigger.html" . }}
      </li>
    
      <li>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Переключить тему" title="Переключить тему">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </li>
</ul>
  </nav>
  </div>
</header>
