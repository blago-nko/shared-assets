{{/* INFRA-DOCK: Centralized Modals for Menu and Share */}}

<!-- 1. Mobile Menu Modal -->
<div id="modal-menu" class="dock-modal-overlay" hidden aria-hidden="true">
  <div class="dock-modal-backdrop" data-close-modal="modal-menu"></div>
  <div class="dock-modal-panel menu-panel" role="dialog" aria-labelledby="menu-title">
    <button class="dock-modal-close" data-close-modal="modal-menu" aria-label="Закрыть меню">&times;</button>
    <h2 id="menu-title" class="sr-only">Навигация</h2>
    <nav class="modal-nav-list">
      <a href="{{ "/" | relURL }}">Главная</a>
      <a href="{{ "posts/" | relURL }}">Статьи</a>
      <a href="{{ "about/" | relURL }}">О нас</a>
      <a href="{{ "tags/" | relURL }}">Ярлыки</a>
    </nav>
  </div>
</div>

<!-- 2. Share Modal -->
