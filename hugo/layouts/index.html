{{ define "main" }}
<section class="posts-section">
  <div class="posts-grid">
    {{ range first 9 .Site.RegularPages.ByDate.Reverse }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </div>
  
  {{ if gt .Site.RegularPages.Len 9 }}
  <div class="pagination-wrapper">
     <!-- Опционально: пагинация -->
  </div>
  {{ end }}
</section>
{{ end }}
