name: Backup Blogger Metadata

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth google-auth-oauthlib google-auth-httplib2

      - name: Backup Blogger metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
        run: |
          python scripts/backup_blogger_metadata.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blogger_image_metadata.json || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore(INFRA): SAM-015 — автоматический бэкап метаданных Blogger [skip ci]" &&
            git push
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
