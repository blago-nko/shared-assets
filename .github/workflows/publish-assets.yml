name: Publish shared-assets to GitHub Packages

on:
  push:
    branches: [ main ]
    paths:
      - 'components/**'
      - 'css/**'
      - 'js/**'
      - 'templates/**'
      - 'jsonld/**'
      - 'seo/**'
      - 'config/**'
      - 'schemas/**'
      - 'favicons/**'
      - 'legal/**'
      - 'security/**'
      - 'optimization/**'
      - 'package.json'
  workflow_dispatch: # Возможность ручного запуска

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
      
      - name: Install dependencies (if any)
        run: npm ci || true
      
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
