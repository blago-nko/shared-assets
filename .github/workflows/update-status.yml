name: Auto-update STATUS.md
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Update STATUS.md timestamp
        run: |
          CURRENT_DATE=$(date -u +"%d.%m.%Y %H:%M UTC")
          sed -i "s/Последнее обновление: .*/Последнее обновление: $CURRENT_DATE | Авто-обновление: ✅ (GitHub Actions)/" docs/STATUS.md
          
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/STATUS.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update STATUS.md timestamp" && git push)
